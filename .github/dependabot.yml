# Dependabot grouping strategy
#
# - Minor and patch updates are batched into a single group per ecosystem
#   (cargo, npm per directory, github-actions) to reduce PR noise.
# - Major-version updates are intentionally left ungrouped so each major bump
#   arrives as its own individual PR for explicit review.
# - Auto-merge is NOT enabled; every grouped PR still requires manual review.
#
# Validate changes with `dependabot validate .github/dependabot.yml` or a
# YAML schema check against the Dependabot v2 schema.

version: 2
updates:
  # Cargo dependencies at the repository root (workspace)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm dependencies for the TypeScript SDK
  - package-ecosystem: "npm"
    directory: "/sdk-ts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-sdk-ts-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm dependencies for the sdk directory
  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-sdk-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm dependencies for the docs site
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-docs-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

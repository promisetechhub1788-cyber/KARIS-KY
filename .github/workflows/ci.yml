name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly fuzzing run (see FUZZING_GUIDE.md). Runs the fuzz targets for a
  # bounded duration so crashes surface as CI failures without always-on fuzzing.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  # Ensure TypeScript SDKs stay aligned with the generated contract interfaces.
  sdk-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache SDK node_modules
        uses: actions/cache@v4
        with:
          path: |
            sdk/node_modules
            sdk-ts/node_modules
          key: ${{ runner.os }}-sdk-node-${{ hashFiles('sdk/package-lock.json', 'sdk-ts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-sdk-node-

      - name: Install and validate SDKs
        shell: bash
        run: |
          set -euo pipefail

          for dir in sdk sdk-ts; do
            if [ ! -d "$dir" ]; then
              echo "Skipping missing SDK project: $dir"
              continue
            fi

            echo "==> Validating $dir"
            cd "$dir"
            npm ci
            npx tsc --noEmit
            npm test -- --runInBand --passWithNoTests
            cd ..
          done

  backup-tooling-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backup test dependencies
        run: python -m pip install pytest "stellar-sdk>=11.0.0"

      - name: Test escrow backup tooling
        run: python -m pytest backend/tests

  fmt-build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Supported toolchain range: the channel pinned in rust-toolchain.toml
        # (currently `stable`) and `stable` itself. See README.md.
        toolchain: [stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # Channel is pinned by rust-toolchain.toml at the repo root; the
        # action reads it so CI and contributors use the same toolchain.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt -p karis_ky_escrow -- --check

      - name: Clippy
        run: cargo clippy -p karis_ky_escrow -- -D warnings

      - name: Clippy REPL CLI
        run: cargo clippy -p repl-cli -- -D warnings

      - name: Build
        run: cargo build

      - name: Build docs (deny broken intra-doc links)
        # Fails CI on any broken rustdoc intra-doc link so documentation
        # references to non-existent items cannot regress unnoticed.
        #
        # Policy: the broken-intra-doc-link deny applies to the *entire*
        # workspace (not just the escrow crate), so `repl-cli` and every other
        # workspace member is checked too. This prevents stale references from
        # creeping in. Keep `--workspace` here in sync with the workspace lint.
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit (dependency vulnerability scan)
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@c95a8e71b2aa92ca779c9c822b9d41038c0fc503 # cargo-deny

      - name: Run cargo-deny (licenses, bans, advisories)
        run: cargo deny check

      - name: Check advisory ignore sync (deny.toml vs cargo audit)
        # Fails CI when an advisory ignored in deny.toml is not also handled
        # by the cargo-audit ignore list (or vice versa), preventing drift
        # between the two dependency-safety tools. See docs/DEPENDENCY_POLICY.md.
        run: python3 scripts/check_advisory_ignore_sync.py

      - name: Build and run basic_workflow example
        # The example is a contributor's first touchpoint; a broken example
        # must fail CI. Expected output is documented in
        # examples/README.md (see "basic_workflow").
        run: cargo run --example basic_workflow

      - name: Run tests
        run: cargo test

      - name: Test REPL CLI
        run: cargo test -p repl-cli

      - name: Validate pre-flight checklist references
        # Ensures scripts/pre-flight-checklist.sh stays current: every file it
        # references must exist and every `stellar contract invoke` method it
        # calls must be a public entrypoint in escrow/src/lib.rs.
        run: |
          python3 scripts/validate_preflight_checklist.py \
            --script scripts/pre-flight-checklist.sh \
            --lib escrow/src/lib.rs

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@671164c891d3e20f5b8ece04798d0154d1262d65 # cargo-llvm-cov

      # -----------------------------------------------------------------------
      # Coverage summary
      # -----------------------------------------------------------------------
      #
      # Appends a concise markdown summary of test counts and line coverage
      # (plus the delta vs main) to the GitHub Actions job summary so reviewers
      # get a quick signal. The project target is >=95% line coverage as stated
      # in START_HERE.txt; this step reports against that threshold but does
      # not fail CI on a coverage drop (that is a separate policy decision).

      - name: Coverage summary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          # Collect coverage for the whole workspace as JSON.
          cargo llvm-cov --workspace --json --output-path cov.json

          # Fetch main's baseline coverage summary if available.
          if [ -f cov-main.json ]; then
            echo "Using cached main baseline cov-main.json"
          else
            echo "No main baseline available; delta will be reported as n/a"
          fi

          python3 - <<'PY'
          import json
          import os

          THRESHOLD = 95.0

          def load(path):
              if not os.path.exists(path):
                  return None
              with open(path) as f:
                  return json.load(f)

          def summarize(data):
              if data is None:
                  return None
              totals = data.get("data", [{}])[0].get("totals", {})
              lines = totals.get("lines", {})
              count = lines.get("count", 0)
              covered = lines.get("covered", 0)
              pct = lines.get("percent", 0.0)
              return {"count": count, "covered": covered, "percent": pct}

          current = summarize(load("cov.json"))
          baseline = summarize(load("cov-main.json"))

          lines = []
          lines.append("## Coverage summary")
          lines.append("")
          lines.append(f"Target: **>={THRESHOLD:.0f}%** line coverage (see START_HERE.txt).")
          lines.append("")
          lines.append("| Metric | Value |")
          lines.append("| --- | --- |")
          if current is None:
              lines.append("| Line coverage | n/a |")
              lines.append("| Lines covered | n/a |")
          else:
              lines.append(f"| Line coverage | {current['percent']:.2f}% |")
              lines.append(f"| Lines covered | {current['covered']}/{current['count']} |")
              status = "PASS" if current["percent"] >= THRESHOLD else "BELOW TARGET"
              lines.append(f"| Threshold status | {status} |")
          if baseline is None:
              lines.append("| Coverage delta vs main | n/a |")
          else:
              delta = current["percent"] - baseline["percent"] if current else 0.0
              sign = "+" if delta >= 0 else ""
              lines.append(f"| Coverage delta vs main | {sign}{delta:.2f}% |")
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release -p karis_ky_escrow
        env:
          # Make missing git metadata a hard build error in CI/release builds
          # so the WASM artifact always carries a real commit hash. Local dev
          # builds can unset this to allow tarball/shallow-checkout workflows.
          REQUIRE_GIT_METADATA: "1"

      # -----------------------------------------------------------------------
      # Build metadata validation
      # -----------------------------------------------------------------------
      #
      # Verifies that the metadata embedded into the WASM artifact by
      # `escrow/build.rs` (git commit, build timestamp, package version,
      # and the source-of-truth schema/interface versions) matches the
      # values declared in `escrow/src/lib.rs`. Fails the build on drift.

      - name: Validate embedded build metadata
        run: |
          python3 scripts/validate_build_metadata.py \
            --json target/build_metadata.json \
            --lib escrow/src/lib.rs

      - name: Validate WASM build metadata matches current commit
        # Asserts the metadata embedded in the freshly built WASM artifact
        # matches the current commit SHA and the expected schema version.
        # Fails CI if build.rs did not regenerate constants (e.g. stale
        # incremental builds) or if the schema version drifted.
        run: |
          python3 scripts/validate_build_metadata.py \
            --wasm target/wasm32-unknown-unknown/release/karis_ky_escrow.wasm \
            --commit "$GITHUB_SHA" \
            --schema-version "${SCHEMA_VERSION:-6}"
        env:
          SCHEMA_VERSION: "6"

      # -----------------------------------------------------------------------
      # Schema version compatibility matrix validation
      # -----------------------------------------------------------------------
      #
      # Validates that SCHEMA_VERSION in escrow/src/lib.rs matches the latest
      # entry in docs/VERSION_INTEROPERABILITY_MATRIX.md. Catches drift that
      # could lead operators to attempt unsupported upgrade paths.

      - name: Validate schema version matrix
        run: |
          python3 scripts/validate_schema_version_matrix.py

      - name: Test schema version matrix validation
        run: |
          python3 scripts/test_validate_schema_version_matrix.py

      # -----------------------------------------------------------------------
      # Release preflight
      # -----------------------------------------------------------------------
      #
      # Runs the build-metadata validator, the contract spec check, and the
      # schema version matrix validator together and reports a go/no-go.
      # Exits non-zero if any of the three validators fail.

      - name: Release preflight
        run: bash scripts/release_preflight.sh

      # -----------------------------------------------------------------------
      # WASM size tracking
      # -----------------------------------------------------------------------

      - name: Check WASM size
        # Fails the build if the artifact exceeds 1 MB or grew >10% vs baseline.
        # On pushes to main, --record updates the baseline JSON and it is
        # committed back via the "Update WASM size baseline" step below.
        run: |
          python3 scripts/check_wasm_size.py \
            --wasm target/wasm32-unknown-unknown/release/karis_ky_escrow.wasm \
            --baseline scripts/wasm_size_baseline.json \
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--record' || '' }}

      - name: Generate WASM size trend report
        # Always runs (even on failure) so we get a report in the job summary.
        if: always()
        run: |
          python3 scripts/wasm_size_report.py \
            --baseline scripts/wasm_size_baseline.json \
            --format markdown \
            --out /tmp/wasm_size_report.md
          # Append to the GitHub Actions job summary
          cat /tmp/wasm_size_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WASM size report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-size-report
          path: /tmp/wasm_size_report.md
          retention-days: 90

      - name: Upload WASM artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: karis-ky-escrow-wasm
          path: target/wasm32-unknown-unknown/release/karis_ky_escrow.wasm
          retention-days: 90

      - name: Commit updated WASM size baseline
        # Only runs on main push after a clean size check, so baseline stays
        # in sync with production builds.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet scripts/wasm_size_baseline.json || (
            git add scripts/wasm_size_baseline.json &&
            git commit -m "chore: update WASM size baseline [skip ci]" &&
            git push
          )

      # -----------------------------------------------------------------------
      # Contract spec (ABI) extraction and publishing
      # -----------------------------------------------------------------------

      - name: Validate contract spec
        # Ensures spec.json is valid JSON and matches the deployed contract version.
        run: |
          python3 -c "
          import json
          with open('sdk-ts/spec.json') as f:
              spec = json.load(f)
          sv = spec['contract']['schema_version']
          iv = spec['contract']['interface_version']
          print(f'Spec schema_version={sv}, interface_version={iv}')
          assert sv == ${SCHEMA_VERSION:-6}, f'spec schema_version {sv} != expected ${SCHEMA_VERSION:-6}'
          assert iv == ${INTERFACE_VERSION:-1}, f'spec interface_version {iv} != expected ${INTERFACE_VERSION:-1}'
          print('Spec validation OK')
          "
        env:
          SCHEMA_VERSION: "6"
          INTERFACE_VERSION: "1"

      - name: Upload contract spec artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: karis-ky-escrow-spec
          path: sdk-ts/spec.json
          retention-days: 90

      - name: Publish spec to GitHub Release
        # On main pushes, attach the spec to a versioned GitHub release.
        # Creates or updates a 'spec' tag release with the latest spec.json.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SPEC_VERSION="v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          echo "SPEC_VERSION=${SPEC_VERSION}" >> $GITHUB_ENV

  # ---------------------------------------------------------------------------
  # Nightly fuzzing
  # ---------------------------------------------------------------------------
  #
  # Runs each fuzz target for a bounded duration (FUZZ_DURATION seconds) via
  # run_fuzz.sh. Any non-zero exit (crash, timeout, build failure) fails the
  # job so regressions surface in CI. See FUZZING_GUIDE.md for details.
  fuzz-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [escrow_fuzz]
    env:
      FUZZ_DURATION: "300"
      FUZZ_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz target ${{ matrix.target }}
        # Bounded run: exits non-zero on crash so CI fails.
        run: ./run_fuzz.sh "${{ matrix.target }}" "$FUZZ_DURATION" "$FUZZ_WORKERS"

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore
